[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mordecai3"
version = "3.4.0"
description = "Full text geoparsing/toponym resolution with event geolocation"
readme = {file = "README.md", content-type = "text/markdown"}
license = {text = "MIT"}
keywords = ["geoparsing", "nlp", "geocoding", "toponym resolution"]
authors = [
    {name = "Andy Halterman", email = "ahalterman0@gmail.com"}
]
requires-python = ">=3.10"
dependencies = [
    "elasticsearch-dsl>=7.3.0,<8.0",
    "elasticsearch>=7.11.0,<8.0",
    "jellyfish>=0.8.2,<2.0",
    "jsonlines>=3.0.0",
    "numpy",
    "pandas",
    "scikit-learn>=0.24.1",
    "spacy>=3.8.7,<3.9",
    "torch>=2.7,<3.0",
    "tqdm>=4.56.1,<5.0",
    "transformers>=4.2.2,<5.0",
    "typer>=0.3.2,<1.0",
    "xmltodict>=0.12.0,<1.0"
]

[project.optional-dependencies]
streamlit = ["streamlit>=1.0.0"]
# The geoparse console demo (console/). fastapi+uvicorn serve it; ijson streams
# the 1.3 GB geoBoundaries CGAZ GeoJSON without holding it in memory; shapely
# simplifies the polygons on the way into the SQLite store.
console = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "ijson>=3.2",
    "shapely>=2.0",
]
# Without cupy, spacy.prefer_gpu() returns False and the transformer runs on
# CPU -- no error, just ~5x slower. Capped below 14 because thinc 8.3's
# xp2torch still uses cupy's deprecated toDlpack(), which cupy 14 hands to
# torch in a form it rejects ("invalid capsule").
gpu = ["cupy-cuda12x>=13,<14"]

[project.scripts]
mordecai3-app = "mordecai3:run_streamlit_app"

[project.urls]
Homepage = "http://github.com/ahalterman/mordecai3/"
Repository = "https://github.com/ahalterman/mordecai3.git"

[tool.setuptools.packages.find]
namespaces = false
# The console demo is not part of the library: it ships a vendored d3 bundle,
# a basemap and the design handoff, none of which belong in the wheel. Run it
# from a checkout -- see console/README.md.
exclude = ["console*", "tools*", "tests*", "experiments*"]

[tool.setuptools.package-data]
mordecai3 = [
    "assets/admin1CodesASCII.txt",
    "assets/country_bert_768.npy",
    "assets/countryInfo.txt",
    "assets/feature_code_dict.json",
    "assets/hierarchy.txt",
    "assets/mordecai_2025-08-27.pt",
    "assets/mordecai_2026-08-20_seed101.pt",
    "assets/mordecai_2026-08-20_seed101.pt.json",
    "assets/mordecai_2026-08-20_e54_seed42.pt",
    "assets/mordecai_2026-08-20_e54_seed42.pt.json",
    "assets/outlet_homes.json",
    "assets/span_head_2026-08-20_gold.pt",
    "assets/span_head_2026-08-20_all.pt",
    "assets/wikipedia-iso-country-codes.txt"
]

[dependency-groups]
# The spaCy model is a direct-URL wheel, so it lives in a group rather than in
# [project.dependencies] (PyPI rejects direct URLs). Without it declared
# somewhere, `uv sync` prunes it out of the venv and spacy.load() starts failing.
models = [
    "en_core_web_trf",
]
dev = [
    "pytest>=8.3.4",
    # console/test_console_ui.py drives a real browser. Declared here because
    # console/README.md tells people to run it: installed by hand instead, it
    # works until the next `uv sync` prunes it and the instruction breaks.
    # The browser binary is separate -- `uv run playwright install chromium`.
    "playwright>=1.44",
    {include-group = "models"},
]
es-data = [
    "textacy>=0.13.0",
]
train = [
    "wandb>=0.16",
    "haversine>=2.8",
    "mordecai3[gpu]",
    {include-group = "models"},
]

[tool.uv.sources]
en_core_web_trf = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_trf-3.8.0/en_core_web_trf-3.8.0-py3-none-any.whl" }
